[project]
name = "signalweek"
version = "0.0.1"
description = "signalweek MVP"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "starlette>=0.37",
    "tzdata>=2024.1",
]

[project.scripts]
signalweek = "signalweek.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
