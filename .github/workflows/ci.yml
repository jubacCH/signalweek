name: ci
on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/embed-model
          key: embed-model-${{ hashFiles('src/signalweek/ingest/embed.py') }}
      - name: Download embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python -m signalweek.ingest.embed download "$RUNNER_TEMP/embed-model"
      - name: Test (pytest)
        env:
          SIGNALWEEK_EMBED_MODEL_DIR: ${{ runner.temp }}/embed-model
        run: pytest
